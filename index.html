<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kalkulator</title>
        <link rel="stylesheet" href="STYLE/style.css">
    </head>
    <body>
        <main>
            <div class="layar-kuadrat">
            <div class="layar">
                <div class="step0">
                    <div class="nama0">
                        <label>HITUNG</label>
                        <label>SALDO</label>
                    </div>
                    <button class="btn0">MULAI</button>
                </div>

                <div class="step1">
                    <div class="nama1">
                        <label>MASUKKAN</label>
                        <label>SALDO ANDA</label>
                    </div>
                    <div class="input">
                    <input type="number" class="inputAwal" placeholder="Contoh: 100000">
                    <p class="error1">Masukkan input anda!</p>
                    <button class="btn1">LANJUT</button>
                    </div>   
                </div>
                
                <div class="step2">
                    <div class="nama2">
                        <label>MASUKKAN</label>
                        <label>NAMA PENGELUARAN</label>
                    </div>
                    <div class="input">
                    <input type="text" class="inputNama" placeholder='Contoh: Kopi'>
                    <p class="error2">Masukkan input anda!</p>
                    <button class="btn2">LANJUT</button>
                    </div>
                </div>

                <div class="step3">
                    <div class="nama3">
                        <label>MASUKKAN</label>
                        <label>PENGELUARAN</label>
                    </div>
                    <div class="input">
                    <input type="number" class="inputPengeluaran" placeholder="Contoh: 20000">
                    <p class="error3">Masukkan input anda!</p>
                    <button class="btn3">LANJUT</button>
                    </div>
                </div>

                <div class="step4">
                    <div class="nama4">
                        <label>SISA SALDO</label>
                        <label>ANDA ADALAH</label>
                    </div>
                    <div class="sisa">
                    <h2 class="Rp">Rp. <spantype="number" class="sisaSaldo"></span></h2>
                    </div>
                </div>
            </div>
            </div>
            <article>
                <div class="info">
                    <h2 class="nama5">INFO ANDA</h2>
                    <div class="isiinfo">
                        <table>
                            <tr>
                                <th class="satu">Saldo anda:</th>
                                <td class="satu">Rp. <span class="saldoAnda">0</span></td>
                            </tr>

                            <tr>
                                <th class="dua">Nama pengeluaran:</th>
                                <td class="dua"><span class="namaPengeluaran">none</span></td>
                            </tr>

                            <tr>
                                <th class="tiga">Pengeluaran:</th>
                                <td class="tiga">Rp. <span class="pengeluaran">0</span></td>
                            </tr>
                        </table>
                    </div>
                    <div class="jarak">-</div>
                    <ul class="daftarTransaksi"></ul>
                </div>
            </article>
        </main>         
         
        <script src="main.js"></script>
    </body>
</html>
